<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Doodle Dash</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@500;600;700&display=swap');

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body {
  margin:0;
  overflow:hidden;
  background:#cfe6df;
  font-family:Quicksand,sans-serif;
  color:#51463f;
}

canvas {
  width:100vw;
  height:100vh;
  display:block;
}


/* ==============================
   START SCREEN
================================ */

#startScreen,
#shopScreen {
  position:fixed;
  inset:0;

  display:flex;
  justify-content:center;
  align-items:center;

  background:rgba(207,230,223,.96);

  z-index:100;
}

.panel {
  width:min(92vw,520px);

  background:#fffaf0;

  border:4px solid #51463f;
  border-radius:28px;

  padding:28px;

  text-align:center;

  box-shadow:7px 7px 0 #c2b1a1;
}

.title {
  font-family:"Patrick Hand",cursive;
  font-size:58px;
  margin:0 0 4px;
}

.subtitle {
  margin-top:0;
  color:#766a62;
}

.carPreview {
  width:120px;
  height:170px;

  margin:20px auto;

  border-radius:30px;

  border:5px solid #51463f;

  position:relative;
  transition:.2s;
}

.carPreview::before {
  content:"";

  position:absolute;

  left:18px;
  right:18px;
  top:35px;
  height:55px;

  background:#b9d9d8;

  border:4px solid #51463f;

  border-radius:15px;
}

.colorChoices {
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin:20px 0;
}

.colorButton {
  width:42px;
  height:42px;

  border-radius:50%;

  border:3px solid #51463f;

  cursor:pointer;
}

.startButton,
.buyButton,
.closeButton {

  border:3px solid #51463f;

  background:#9abb9e;
  color:white;

  border-radius:16px;

  padding:12px 25px;

  font-family:"Patrick Hand",cursive;

  font-size:25px;

  box-shadow:3px 3px 0 #51463f;

  cursor:pointer;
}

.startButton:active,
.buyButton:active {
  transform:translateY(2px);
}


/* ==============================
   HUD
================================ */

#hud {
  position:fixed;

  top:14px;
  left:14px;
  right:14px;

  display:flex;
  justify-content:space-between;

  z-index:10;

  pointer-events:none;
}

.card {

  background:#fffaf0;

  border:3px solid #51463f;

  border-radius:16px;

  padding:9px 13px;

  box-shadow:3px 3px 0 #c8b5a4;
}

#customer {
  font-family:"Patrick Hand",cursive;
  font-size:22px;
}

#address {
  font-size:12px;
}

#direction {

  position:fixed;

  top:105px;
  left:50%;

  transform:translateX(-50%);

  background:#fffaf0;

  border:3px solid #51463f;

  border-radius:30px;

  padding:8px 18px;

  font-family:"Patrick Hand",cursive;

  font-size:21px;

  z-index:10;

  pointer-events:none;
}


/* ==============================
   SHOP BUTTON
================================ */

#shopButton {

  position:fixed;

  top:105px;
  right:14px;

  z-index:15;

  border:3px solid #51463f;

  background:#fffaf0;

  border-radius:15px;

  padding:8px 13px;

  font-family:"Patrick Hand",cursive;

  font-size:20px;

  box-shadow:3px 3px 0 #c8b5a4;
}


/* ==============================
   DELIVERY BUTTON
================================ */

#deliver {

  position:fixed;

  bottom:125px;
  left:50%;

  transform:translateX(-50%);

  display:none;

  z-index:20;

  border:3px solid #51463f;

  border-radius:17px;

  background:#93b99c;

  color:white;

  padding:12px 28px;

  font-family:"Patrick Hand",cursive;

  font-size:25px;

  box-shadow:3px 3px 0 #51463f;
}


/* ==============================
   MESSAGE
================================ */

#message {

  position:fixed;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  display:none;

  z-index:60;

  background:#fffaf0;

  border:3px solid #51463f;

  border-radius:20px;

  padding:18px 28px;

  font-family:"Patrick Hand",cursive;

  font-size:29px;

  text-align:center;

  box-shadow:5px 5px 0 #c8b5a4;
}


/* ==============================
   CONTROLS
================================ */

#controls {

  position:fixed;

  left:18px;
  right:18px;
  bottom:18px;

  display:flex;
  justify-content:space-between;

  z-index:30;
}

.group {
  display:flex;
  gap:10px;
}

.control {

  width:75px;
  height:62px;

  border:3px solid #51463f;

  border-radius:19px;

  background:#fffaf0;

  font-family:"Patrick Hand",cursive;

  font-size:28px;

  box-shadow:3px 3px 0 #c8b5a4;
}

@media(pointer:fine) {
  #controls {
    display:none;
  }
}

@media(max-width:600px) {

  .title {
    font-size:47px;
  }

  .panel {
    padding:20px;
  }

  #customer {
    font-size:19px;
  }

}

</style>
</head>


<body>


<!-- ==============================
     START SCREEN
================================ -->

<div id="startScreen">

  <div class="panel">

    <h1 class="title">
      Doodle Dash
    </h1>

    <p class="subtitle">
      Pick your first delivery car ♡
    </p>

    <div
      id="preview"
      class="carPreview">
    </div>

    <div class="colorChoices">

      <button class="colorButton"
              style="background:#e99d92"
              onclick="chooseColor('#e99d92')">
      </button>

      <button class="colorButton"
              style="background:#9db9df"
              onclick="chooseColor('#9db9df')">
      </button>

      <button class="colorButton"
              style="background:#a9c99f"
              onclick="chooseColor('#a9c99f')">
      </button>

      <button class="colorButton"
              style="background:#d5b2dc"
              onclick="chooseColor('#d5b2dc')">
      </button>

      <button class="colorButton"
              style="background:#f0c77b"
              onclick="chooseColor('#f0c77b')">
      </button>

      <button class="colorButton"
              style="background:#e8e8df"
              onclick="chooseColor('#e8e8df')">
      </button>

    </div>

    <button class="startButton"
            onclick="startGame()">
      Start Driving ♡
    </button>

  </div>

</div>


<!-- ==============================
     SHOP
================================ -->

<div id="shopScreen" style="display:none">

  <div class="panel">

    <h1 class="title">
      Little Car Shop
    </h1>

    <p>
      Money:
      💵 $<span id="shopMoney">0</span>
    </p>

    <div class="colorChoices">

      <button class="colorButton"
              style="background:#e99d92"
              onclick="buyCar('#e99d92',0)">
      </button>

      <button class="colorButton"
              style="background:#9db9df"
              onclick="buyCar('#9db9df',25)">
      </button>

      <button class="colorButton"
              style="background:#a9c99f"
              onclick="buyCar('#a9c99f',35)">
      </button>

      <button class="colorButton"
              style="background:#d5b2dc"
              onclick="buyCar('#d5b2dc',50)">
      </button>

      <button class="colorButton"
              style="background:#f0c77b"
              onclick="buyCar('#f0c77b',75)">
      </button>

      <button class="colorButton"
              style="background:#e8e8df"
              onclick="buyCar('#e8e8df',100)">
      </button>

    </div>

    <p style="font-family:'Patrick Hand';font-size:20px">
      New colors cost more as you unlock them!
    </p>

    <button class="closeButton"
            onclick="closeShop()">
      Back to driving
    </button>

  </div>

</div>


<!-- ==============================
     HUD
================================ -->

<div id="hud">

  <div class="card">

    <div id="customer">
      Delivery
    </div>

    <div id="address">
      Finding address...
    </div>

  </div>

  <div class="card">

    💵 $<span id="money">0</span>

    <br>

    ⏱️ <span id="timer">60</span>

  </div>

</div>


<div id="direction">
  Find your customer ↑
</div>


<button id="shopButton"
        onclick="openShop()">

  🚗 Cars

</button>


<button id="deliver"
        onclick="deliver()">

  Deliver ♡

</button>


<div id="message"></div>


<!-- ==============================
     PHONE CONTROLS
================================ -->

<div id="controls">

  <div class="group">

    <button class="control"
            id="left">
      ←
    </button>

    <button class="control"
            id="right">
      →
    </button>

  </div>

  <div class="group">

    <button class="control"
            id="brake">
      ↓
    </button>

    <button class="control"
            id="gas">
      ↑
    </button>

  </div>

</div>


<canvas id="game"></canvas>


<script>


/* =====================================================
   CANVAS
===================================================== */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

let W,H;

function resize() {

  W =
    canvas.width =
    innerWidth;

  H =
    canvas.height =
    innerHeight;

}

addEventListener(
  "resize",
  resize
);

resize();


/* =====================================================
   CAR
===================================================== */

const car = {

  x:0,
  y:0,

  angle:0,

  speed:0,

  color:"#e99d92",

  maxSpeed:6

};


/* =====================================================
   CAMERA
===================================================== */

const camera = {

  x:0,
  y:0

};


/* =====================================================
   INPUT
===================================================== */

const keys = {};

addEventListener(
  "keydown",
  e => {

    keys[
      e.key.toLowerCase()
    ] = true;

    if (
      ["w","a","s","d",
       "arrowup",
       "arrowdown",
       "arrowleft",
       "arrowright"]
      .includes(
        e.key.toLowerCase()
      )
    )
      e.preventDefault();

    if (
      e.key.toLowerCase()==="e"
    )
      deliver();

  }
);

addEventListener(
  "keyup",
  e => {

    keys[
      e.key.toLowerCase()
    ] = false;

  }
);


function button(id,key) {

  const b =
    document.getElementById(id);

  b.addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();

      keys[key]=true;

    }
  );

  b.addEventListener(
    "pointerup",
    () => {
      keys[key]=false;
    }
  );

  b.addEventListener(
    "pointercancel",
    () => {
      keys[key]=false;
    }
  );

}

button(
  "left",
  "arrowleft"
);

button(
  "right",
  "arrowright"
);

button(
  "gas",
  "arrowup"
);

button(
  "brake",
  "arrowdown"
);


/* =====================================================
   WORLD
===================================================== */

const streetsX =
  [-900,-600,-300,0,300,600,900];

const streetsY =
  [-900,-600,-300,0,300,600,900];

const roadWidth=105;

const houses=[];
const trees=[];


const houseColors=[
  "#efc5bb",
  "#e8d7aa",
  "#c7ddc2",
  "#d9c7e5",
  "#e8c9a6",
  "#c5dce1"
];


/* =====================================================
   HOUSES
===================================================== */

for(
  let x=-1050;
  x<=1050;
  x+=150
) {

  for(
    let y=-1050;
    y<=1050;
    y+=150
  ) {

    const roadX =
      streetsX.some(
        s =>
        Math.abs(x-s)<80
      );

    const roadY =
      streetsY.some(
        s =>
        Math.abs(y-s)<80
      );

    if(
      roadX ||
      roadY
    )
      continue;

    houses.push({

      x,
      y,

      width:76,
      height:62,

      color:
        houseColors[
          Math.floor(
            Math.random() *
            houseColors.length
          )
        ],

      roof:
        Math.random()>.5
        ? "#bd8079"
        : "#7c7890"

    });

  }

}


/* =====================================================
   TREES
===================================================== */

for(
  let i=0;
  i<130;
  i++
) {

  trees.push({

    x:
      Math.random()*2100-1050,

    y:
      Math.random()*2100-1050,

    size:
      15+
      Math.random()*12

  });

}


/* =====================================================
   CUSTOMERS
===================================================== */

const customers=[

  ["Mia","Maple Street"],
  ["Lily","Rose Avenue"],
  ["Emma","Sunny Lane"],
  ["Noah","Pine Road"],
  ["Ava","Cloud Street"],
  ["Sophie","Willow Way"],
  ["Ruby","Meadow Street"],
  ["Ella","Garden Drive"]

];

let customer;
let target;

let money=0;

let time=60;

let done=false;

let timer;


/* =====================================================
   START CAR COLOR
===================================================== */

function chooseColor(color) {

  car.color=color;

  document
    .getElementById("preview")
    .style.background=color;

}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

  document
    .getElementById("startScreen")
    .style.display="none";

  newOrder();

}


/* =====================================================
   NEW DELIVERY
===================================================== */

function newOrder() {

  done=false;

  customer =
    customers[
      Math.floor(
        Math.random()*
        customers.length
      )
    ];

  target =
    houses[
      Math.floor(
        Math.random()*
        houses.length
      )
    ];

  time=60;

  document
    .getElementById("customer")
    .textContent=
      "📦 Delivery for "+
      customer[0];

  document
    .getElementById("address")
    .textContent=
      customer[1]+
      " • House "+
      Math.floor(
        Math.random()*20+1
      );

  clearInterval(timer);

  timer=setInterval(
    () => {

      if(done)
        return;

      time--;

      document
        .getElementById("timer")
        .textContent=
          Math.max(0,time);

      if(time<=0) {

        clearInterval(timer);

        showMessage(
          "Too late! 😭"
        );

        setTimeout(
          newOrder,
          1500
        );

      }

    },
    1000
  );

}


/* =====================================================
   COLLISION DETECTION
===================================================== */

let crashCooldown=0;

function checkCollision() {

  if(crashCooldown>0) {

    crashCooldown--;

    return;

  }


  /*
    Check houses.
  */

  for(
    const house of houses
  ) {

    const dx =
      car.x-house.x;

    const dy =
      car.y-house.y;

    const distance =
      Math.hypot(dx,dy);

    if(distance<48) {

      crash(
        "BONK! You hit a house! 🏠"
      );

      return;

    }

  }


  /*
    Check trees.
  */

  for(
    const tree of trees
  ) {

    const dx =
      car.x-tree.x;

    const dy =
      car.y-tree.y;

    const distance =
      Math.hypot(dx,dy);

    if(
      distance<
      tree.size+22
    ) {

      crash(
        "BONK! Watch the trees! 🌳"
      );

      return;

    }

  }

}


/* =====================================================
   CRASH
===================================================== */

function crash(text) {

  crashCooldown=30;

  /*
    Push the car backwards.
  */

  car.x -=
    Math.sin(car.angle)*25;

  car.y +=
    Math.cos(car.angle)*25;


  /*
    Stop car.
  */

  car.speed=0;


  /*
    Small money penalty.
  */

  if(money>0)
    money=Math.max(
      0,
      money-1
    );


  document
    .getElementById("money")
    .textContent=
      money;


  showMessage(text+"<br>-$1");


  /*
    Tiny camera shake.
  */

  camera.shake=12;

}


/* =====================================================
   DRIVE
===================================================== */

function drive() {

  const gas =
    keys["w"] ||
    keys["arrowup"];

  const brake =
    keys["s"] ||
    keys["arrowdown"];

  const left =
    keys["a"] ||
    keys["arrowleft"];

  const right =
    keys["d"] ||
    keys["arrowright"];


  /*
    Acceleration.
  */

  if(gas) {

    car.speed+=.16;

  } else {

    car.speed*=.96;

  }


  /*
    Reverse / brake.
  */

  if(brake) {

    car.speed-=.22;

  }


  car.speed=
    Math.max(
      -2,
      Math.min(
        car.speed,
        car.maxSpeed
      )
    );


  /*
    Easy steering.
  */

  if(
    Math.abs(car.speed)>.15
  ) {

    if(left)
      car.angle-=.045;

    if(right)
      car.angle+=.045;

  }


  /*
    Movement.
  */

  car.x +=
    Math.sin(car.angle)*
    car.speed;

  car.y +=
    -Math.cos(car.angle)*
    car.speed;


  /*
    World limits.
  */

  car.x=
    Math.max(
      -1100,
      Math.min(
        1100,
        car.x
      )
    );

  car.y=
    Math.max(
      -1100,
      Math.min(
        1100,
        car.y
      )
    );


  checkCollision();

}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera() {

  const distance=170;

  let desiredX=
    car.x-
    Math.sin(car.angle)*
    distance;

  let desiredY=
    car.y+
    Math.cos(car.angle)*
    distance;


  camera.x+=
    (desiredX-camera.x)*
    .09;

  camera.y+=
    (desiredY-camera.y)*
    .09;


  if(camera.shake>0) {

    camera.x +=
      (Math.random()-.5)*
      camera.shake;

    camera.y +=
      (Math.random()-.5)*
      camera.shake;

    camera.shake*=.8;

    if(camera.shake<.5)
      camera.shake=0;

  }

}


/* =====================================================
   DRAW WORLD
===================================================== */

function drawWorld() {

  ctx.clearRect(
    0,0,W,H
  );


  ctx.save();

  ctx.translate(
    W/2-camera.x,
    H/2-camera.y
  );


  /*
    Grass.
  */

  ctx.fillStyle="#b8d2ad";

  ctx.fillRect(
    -1300,
    -1300,
    2600,
    2600
  );


  /*
    Roads.
  */

  streetsX.forEach(x => {

    ctx.fillStyle="#d9d1c7";

    ctx.fillRect(
      x-64,
      -1300,
      128,
      2600
    );

    ctx.fillStyle="#989794";

    ctx.fillRect(
      x-50,
      -1300,
      100,
      2600
    );

  });


  streetsY.forEach(y => {

    ctx.fillStyle="#d9d1c7";

    ctx.fillRect(
      -1300,
      y-64,
      2600,
      128
    );

    ctx.fillStyle="#989794";

    ctx.fillRect(
      -1300,
      y-50,
      2600,
      100
    );

  });


  /*
    Road markings.
  */

  ctx.strokeStyle="#eee2c8";

  ctx.lineWidth=4;

  ctx.setLineDash(
    [25,25]
  );

  streetsX.forEach(x => {

    ctx.beginPath();

    ctx.moveTo(
      x,-1300
    );

    ctx.lineTo(
      x,1300
    );

    ctx.stroke();

  });

  streetsY.forEach(y => {

    ctx.beginPath();

    ctx.moveTo(
      -1300,y
    );

    ctx.lineTo(
      1300,y
    );

    ctx.stroke();

  });

  ctx.setLineDash([]);


  /*
    Trees.
  */

  trees.forEach(tree => {

    if(
      Math.abs(
        tree.x-camera.x
      )>800 ||
      Math.abs(
        tree.y-camera.y
      )>650
    )
      return;


    ctx.fillStyle="#75614f";

    ctx.fillRect(
      tree.x-3,
      tree.y,
      6,
      22
    );


    ctx.fillStyle="#789b71";

    ctx.beginPath();

    ctx.arc(
      tree.x,
      tree.y,
      tree.size,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#51463f";

    ctx.lineWidth=3;

    ctx.stroke();

  });


  /*
    Houses.
  */

  houses.forEach(
    house => {

      if(
        Math.abs(
          house.x-camera.x
        )>850 ||
        Math.abs(
          house.y-camera.y
        )>650
      )
        return;


      ctx.fillStyle=
        house.color;

      ctx.strokeStyle=
        "#51463f";

      ctx.lineWidth=4;


      ctx.fillRect(
        house.x-38,
        house.y-30,
        76,
        62
      );

      ctx.strokeRect(
        house.x-38,
        house.y-30,
        76,
        62
      );


      /*
        Roof.
      */

      ctx.fillStyle=
        house.roof;

      ctx.beginPath();

      ctx.moveTo(
        house.x-48,
        house.y-30
      );

      ctx.lineTo(
        house.x,
        house.y-70
      );

      ctx.lineTo(
        house.x+48,
        house.y-30
      );

      ctx.closePath();

      ctx.fill();
      ctx.stroke();


      /*
        Door.
      */

      ctx.fillStyle=
        "#a77763";

      ctx.fillRect(
        house.x-9,
        house.y+3,
        18,
        29
      );

      ctx.strokeRect(
        house.x-9,
        house.y+3,
        18,
        29
      );


      /*
        Windows.
      */

      ctx.fillStyle=
        "#f6e5a9";

      ctx.fillRect(
        house.x-29,
        house.y-18,
        17,
        17
      );

      ctx.fillRect(
        house.x+12,
        house.y-18,
        17,
        17
      );

    }
  );


  /*
    Destination.
  */

  if(
    target &&
    !done
  ) {

    const d=
      Math.hypot(
        target.x-car.x,
        target.y-car.y
      );


    if(d<650) {

      ctx.strokeStyle=
        "#df8b82";

      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.arc(
        target.x,
        target.y-90,
        17,
        0,
        Math.PI*2
      );

      ctx.stroke();


      ctx.fillStyle=
        "#df8b82";

      ctx.font=
        "bold 22px Patrick Hand";

      ctx.textAlign="center";

      ctx.fillText(
        "DROP OFF",
        target.x,
        target.y-115
      );

    }

  }


  drawCar();

  ctx.restore();

}


/* =====================================================
   CAR DRAWING
===================================================== */

function drawCar() {

  ctx.save();

  ctx.translate(
    car.x,
    car.y
  );

  ctx.rotate(
    car.angle
  );


  /*
    Shadow.
  */

  ctx.fillStyle=
    "rgba(60,50,40,.22)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    9,
    28,
    45,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    Wheels.
  */

  ctx.fillStyle="#4e4742";

  ctx.fillRect(
    -28,-23,
    8,20
  );

  ctx.fillRect(
    20,-23,
    8,20
  );

  ctx.fillRect(
    -28,8,
    8,20
  );

  ctx.fillRect(
    20,8,
    8,20
  );


  /*
    Body.
  */

  ctx.fillStyle=
    car.color;

  ctx.strokeStyle=
    "#51463f";

  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.roundRect(
    -23,
    -35,
    46,
    70,
    13
  );

  ctx.fill();
  ctx.stroke();


  /*
    Roof.
  */

  ctx.fillStyle=
    car.color;

  ctx.beginPath();

  ctx.roundRect(
    -18,
    -17,
    36,
    36,
    9
  );

  ctx.fill();
  ctx.stroke();


  /*
    Windows.
  */

  ctx.fillStyle=
    "#b8d7d7";

  ctx.beginPath();

  ctx.roundRect(
    -15,
    -14,
    30,
    19,
    5
  );

  ctx.fill();
  ctx.stroke();


  ctx.beginPath();

  ctx.roundRect(
    -14,
    7,
    28,
    11,
    4
  );

  ctx.fill();
  ctx.stroke();


  /*
    Headlights.
  */

  ctx.fillStyle=
    "#f5df8c";

  ctx.beginPath();

  ctx.arc(
    -14,-31,
    5,
    0,
    Math.PI*2
  );

  ctx.arc(
    14,-31,
    5,
    0,
    Math.PI*2
  );

  ctx.fill();
  ctx.stroke();


  /*
    Delivery sign.
  */

  ctx.fillStyle=
    "#fffaf0";

  ctx.beginPath();

  ctx.roundRect(
    -16,
    -49,
    32,
    12,
    5
  );

  ctx.fill();
  ctx.stroke();


  ctx.restore();

}


/* =====================================================
   DIRECTION
===================================================== */

function updateDirection() {

  if(!target)
    return;


  const dx=
    target.x-car.x;

  const dy=
    target.y-car.y;

  const distance=
    Math.hypot(dx,dy);


  if(distance<75) {

    document
      .getElementById(
        "direction"
      )
      .textContent=
        "🏠 You're here!";

    document
      .getElementById(
        "deliver"
      )
      .style.display=
        "block";

    return;

  }


  let angle=
    Math.atan2(
      dx,
      -dy
    );


  let difference=
    angle-car.angle;


  while(
    difference>Math.PI
  )
    difference-=Math.PI*2;

  while(
    difference<-Math.PI
  )
    difference+=Math.PI*2;


  let arrow="↑";

  if(difference>.4)
    arrow="↗";

  if(difference>1.2)
    arrow="→";

  if(difference<-.4)
    arrow="↖";

  if(difference<-1.2)
    arrow="←";


  document
    .getElementById(
      "direction"
    )
    .textContent=
      arrow+
      " "+
      Math.round(distance)+
      "m";

}


/* =====================================================
   DELIVERY
===================================================== */

function deliver() {

  if(done)
    return;


  const distance=
    Math.hypot(
      target.x-car.x,
      target.y-car.y
    );


  if(distance>75) {

    showMessage(
      "You're not at the house yet!"
    );

    return;

  }


  if(
    Math.abs(car.speed)>.7
  ) {

    showMessage(
      "Stop the car first! 🚗"
    );

    return;

  }


  done=true;

  clearInterval(timer);


  const tip=
    Math.max(
      1,
      Math.floor(time/8)
    );

  const earned=
    6+tip;

  money+=earned;


  document
    .getElementById("money")
    .textContent=
      money;


  document
    .getElementById("deliver")
    .style.display=
      "none";


  showMessage(
    "Delivery complete! ♡<br>+$"+
    earned
  );


  setTimeout(
    newOrder,
    1800
  );

}


/* =====================================================
   CAR SHOP
===================================================== */

function openShop() {

  document
    .getElementById("shopScreen")
    .style.display="flex";

  document
    .getElementById("shopMoney")
    .textContent=
      money;

}


function closeShop() {

  document
    .getElementById("shopScreen")
    .style.display=
      "none";

}


function buyCar(color,price) {

  if(price===0) {

    car.color=color;

    showMessage(
      "You already have this car ♡"
    );

    return;

  }


  if(money<price) {

    showMessage(
      "You need $"+
      (price-money)+
      " more! 💵"
    );

    return;

  }


  money-=price;

  car.color=color;


  document
    .getElementById("money")
    .textContent=
      money;

  document
    .getElementById("shopMoney")
    .textContent=
      money;


  showMessage(
    "New car unlocked! 🚗♡"
  );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text) {

  const box=
    document.getElementById(
      "message"
    );

  box.innerHTML=text;

  box.style.display="block";

  clearTimeout(
    box.hide
  );

  box.hide=
    setTimeout(
      () =>
        box.style.display="none",
      1500
    );

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop() {

  drive();

  updateCamera();

  updateDirection();

  drawWorld();

  requestAnimationFrame(loop);

}

loop();


</script>
