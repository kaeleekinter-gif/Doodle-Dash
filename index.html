<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Doodle Dash</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #b9dce8;
  font-family: Arial, sans-serif;
  touch-action: none;
}

canvas {
  display: block;
}

/* ---------- START ---------- */

#start {
  position: fixed;
  inset: 0;
  z-index: 100;

  display: flex;
  justify-content: center;
  align-items: center;

  background: #c9e5df;
}

.startBox {
  width: min(90%, 470px);

  background: #fffaf1;

  border: 4px solid #403a37;
  border-radius: 28px;

  padding: 30px;

  text-align: center;

  box-shadow: 8px 8px 0 rgba(64,58,55,.25);
}

.startBox h1 {
  margin: 0;

  font-size: 55px;
  letter-spacing: -2px;
}

.startBox p {
  color: #706760;
  line-height: 1.6;
}

#startButton {
  padding: 14px 28px;

  border: 3px solid #403a37;
  border-radius: 16px;

  background: #8ebd96;
  color: white;

  font-size: 20px;
  font-weight: bold;

  box-shadow: 4px 4px 0 #403a37;
}

#startButton:active {
  transform: translate(3px,3px);
}

/* ---------- HUD ---------- */

#hud {
  position: fixed;

  top: 14px;
  left: 14px;
  right: 14px;

  z-index: 20;

  display: flex;
  justify-content: space-between;

  pointer-events: none;
}

.card {
  background: rgba(255,250,241,.95);

  border: 3px solid #403a37;
  border-radius: 16px;

  padding: 9px 14px;

  box-shadow: 4px 4px 0 rgba(64,58,55,.22);
}

#money {
  font-size: 20px;
  font-weight: bold;
}

#objective {
  position: fixed;

  top: 88px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 20;

  background: #fffaf1;

  border: 3px solid #403a37;
  border-radius: 22px;

  padding: 9px 18px;

  font-weight: bold;

  white-space: nowrap;
}

/* ---------- PHONE ---------- */

#phone {
  position: fixed;

  width: 240px;

  right: 18px;
  bottom: 90px;

  z-index: 50;

  display: none;

  background: #242424;

  border: 5px solid #151515;
  border-radius: 25px;

  padding: 14px;

  color: white;

  box-shadow: 8px 8px 0 rgba(0,0,0,.3);
}

.phoneTop {
  text-align: center;
  font-size: 11px;
  opacity: .65;
}

.notification {
  margin-top: 12px;

  background: #f7f7f7;
  color: #333;

  border-radius: 15px;

  padding: 14px;
}

.notification h3 {
  margin: 0 0 8px;
}

#acceptButton {
  width: 100%;

  margin-top: 10px;

  border: 0;
  border-radius: 12px;

  padding: 10px;

  background: #8ebd96;
  color: white;

  font-weight: bold;
}

/* ---------- INTERACTION ---------- */

#interaction {
  position: fixed;

  left: 50%;
  bottom: 125px;

  transform: translateX(-50%);

  z-index: 30;

  display: none;

  background: #fff8df;

  border: 3px solid #403a37;
  border-radius: 15px;

  padding: 12px 22px;

  font-weight: bold;

  box-shadow: 4px 4px 0 rgba(64,58,55,.25);
}

/* ---------- MOBILE ---------- */

#controls {
  position: fixed;

  left: 15px;
  right: 15px;
  bottom: 18px;

  z-index: 30;

  display: flex;
  justify-content: space-between;
}

.controlGroup {
  display: flex;
  gap: 9px;
}

.control {
  width: 65px;
  height: 58px;

  border: 3px solid #403a37;
  border-radius: 17px;

  background: rgba(255,250,241,.9);

  font-size: 25px;

  box-shadow: 3px 3px 0 rgba(64,58,55,.25);
}

.control:active {
  transform: translateY(2px);
}

@media (pointer:fine) {
  #controls {
    display: none;
  }
}

/* ---------- MESSAGE ---------- */

#message {
  position: fixed;

  left: 50%;
  top: 50%;

  transform: translate(-50%,-50%);

  z-index: 200;

  display: none;

  background: #fffaf1;

  border: 4px solid #403a37;
  border-radius: 20px;

  padding: 20px 28px;

  text-align: center;

  font-size: 23px;
  font-weight: bold;

  box-shadow: 6px 6px 0 rgba(64,58,55,.3);
}
</style>
</head>

<body>


<!-- START SCREEN -->

<div id="start">

  <div class="startBox">

    <h1>Doodle Dash</h1>

    <p>
      Welcome to your new delivery job! 🚗
    </p>

    <p>
      Get a delivery text.<br>
      Drive to the restaurant.<br>
      Pick up the food.<br>
      Deliver it to the customer.<br>
      Get paid!
    </p>

    <button id="startButton">
      START DRIVING
    </button>

  </div>

</div>


<!-- HUD -->

<div id="hud">

  <div class="card">
    📦 <span id="orderText">Waiting for an order...</span>
  </div>

  <div class="card">
    💵 $<span id="money">0.00</span>
  </div>

</div>


<div id="objective">
  Waiting for a delivery...
</div>


<!-- PHONE -->

<div id="phone">

  <div class="phoneTop">
    DOODLE PHONE
  </div>

  <div class="notification">

    <h3>📱 New Delivery!</h3>

    <div id="notificationText"></div>

    <button id="acceptButton">
      ACCEPT ORDER
    </button>

  </div>

</div>


<!-- INTERACTION -->

<div id="interaction">
  Press E to interact
</div>


<!-- MOBILE CONTROLS -->

<div id="controls">

  <div class="controlGroup">

    <button class="control" id="left">
      ◀
    </button>

    <button class="control" id="right">
      ▶
    </button>

  </div>

  <div class="controlGroup">

    <button class="control" id="brake">
      ▼
    </button>

    <button class="control" id="gas">
      ▲
    </button>

  </div>

</div>


<div id="message"></div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>


<script>

/* =========================================================
   GAME SETUP
========================================================= */

const scene = new THREE.Scene();

scene.background =
  new THREE.Color("#b9dce8");


const camera =
  new THREE.PerspectiveCamera(
    72,
    innerWidth / innerHeight,
    .1,
    1500
  );


const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
  renderer.domElement
);


/* =========================================================
   LIGHTS
========================================================= */

scene.add(
  new THREE.HemisphereLight(
    "#ffffff",
    "#809579",
    2.2
  )
);


const sun =
  new THREE.DirectionalLight(
    "#fff1d2",
    2
  );

sun.position.set(
  100,
  180,
  80
);

sun.castShadow = true;

scene.add(sun);


/* =========================================================
   MATERIAL
========================================================= */

function mat(color) {

  return new THREE.MeshStandardMaterial({
    color,
    roughness:.85
  });

}


/* =========================================================
   GROUND
========================================================= */

const ground =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      1000,
      1000
    ),
    mat("#a9c99d")
  );

ground.rotation.x =
  -Math.PI/2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   ROADS
========================================================= */

const ROAD_WIDTH = 14;

const roadPositions = [
  -180,
  -120,
  -60,
  0,
  60,
  120,
  180
];


function roadVertical(x) {

  const road =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        ROAD_WIDTH,
        .08,
        760
      ),
      mat("#777878")
    );

  road.position.set(
    x,
    .04,
    0
  );

  road.receiveShadow = true;

  scene.add(road);


  /* sidewalks */

  for(
    const side of [-1,1]
  ) {

    const sidewalk =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          3,
          .12,
          760
        ),
        mat("#d5cec3")
      );

    sidewalk.position.set(
      x + side*8.5,
      .08,
      0
    );

    scene.add(sidewalk);

  }

}


function roadHorizontal(z) {

  const road =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        760,
        .08,
        ROAD_WIDTH
      ),
      mat("#777878")
    );

  road.position.set(
    0,
    .04,
    z
  );

  scene.add(road);


  for(
    const side of [-1,1]
  ) {

    const sidewalk =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          760,
          .12,
          3
        ),
        mat("#d5cec3")
      );

    sidewalk.position.set(
      0,
      .08,
      z + side*8.5
    );

    scene.add(sidewalk);

  }

}


roadPositions.forEach(
  roadVertical
);

roadPositions.forEach(
  roadHorizontal
);


/* =========================================================
   ROAD MARKINGS
========================================================= */

roadPositions.forEach(x => {

  for(
    let z=-370;
    z<370;
    z+=18
  ) {

    const line =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .25,
          .05,
          9
        ),
        mat("#f1e5b9")
      );

    line.position.set(
      x,
      .1,
      z
    );

    scene.add(line);

  }

});


roadPositions.forEach(z => {

  for(
    let x=-370;
    x<370;
    x+=18
  ) {

    const line =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          9,
          .05,
          .25
        ),
        mat("#f1e5b9")
      );

    line.position.set(
      x,
      .1,
      z
    );

    scene.add(line);

  }

});


/* =========================================================
   HOUSES
========================================================= */

const houses = [];

const houseColors = [
  "#e9b7ad",
  "#dcc89f",
  "#b9d5b1",
  "#cdb9df",
  "#d8b18c",
  "#afd0d3"
];


function makeHouse(x,z) {

  const group =
    new THREE.Group();


  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        15,
        9,
        12
      ),
      mat(
        houseColors[
          Math.floor(
            Math.random() *
            houseColors.length
          )
        ]
      )
    );

  body.position.y = 4.5;

  body.castShadow = true;

  group.add(body);


  const roof =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        10,
        6,
        4
      ),
      mat("#927070")
    );

  roof.position.y = 12;

  roof.rotation.y =
    Math.PI/4;

  roof.castShadow = true;

  group.add(roof);


  const door =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.5,
        4,
        .3
      ),
      mat("#8b6758")
    );

  door.position.set(
    0,
    2,
    -6.2
  );

  group.add(door);


  for(
    const wx of [-4,4]
  ) {

    const window =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          3,
          2.5,
          .25
        ),
        mat("#a9d9e1")
      );

    window.position.set(
      wx,
      6,
      -6.2
    );

    group.add(window);

  }


  group.position.set(
    x,
    0,
    z
  );

  scene.add(group);

  houses.push({
    x,
    z,
    group
  });

}


/*
  Houses are deliberately placed
  inside blocks.
*/

for(
  let x=-210;
  x<=210;
  x+=60
) {

  for(
    let z=-210;
    z<=210;
    z+=60
  ) {

    if(
      roadPositions.includes(x) ||
      roadPositions.includes(z)
    ) continue;


    makeHouse(
      x-17,
      z-17
    );

    makeHouse(
      x+17,
      z+17
    );

  }

}


/* =========================================================
   TREES
========================================================= */

const trees = [];


function makeTree(x,z) {

  const group =
    new THREE.Group();


  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .65,
        .8,
        4,
        8
      ),
      mat("#80624c")
    );

  trunk.position.y = 2;

  group.add(trunk);


  const leaves =
    new THREE.Mesh(
      new THREE.IcosahedronGeometry(
        4.3,
        1
      ),
      mat("#72a36e")
    );

  leaves.position.y = 6;

  leaves.castShadow = true;

  group.add(leaves);


  group.position.set(
    x,
    0,
    z
  );

  scene.add(group);

  trees.push({
    x,
    z
  });

}


/*
  Trees only go in yards.
*/

for(
  let x=-240;
  x<=240;
  x+=30
) {

  for(
    let z=-240;
    z<=240;
    z+=30
  ) {

    const nearRoadX =
      roadPositions.some(
        r => Math.abs(x-r)<12
      );

    const nearRoadZ =
      roadPositions.some(
        r => Math.abs(z-r)<12
      );

    if(
      !nearRoadX &&
      !nearRoadZ &&
      Math.random()<.32
    ) {

      makeTree(x,z);

    }

  }

}


/* =========================================================
   RESTAURANTS
========================================================= */

const restaurants = [];


function makeRestaurant(
  name,
  x,
  z,
  color
) {

  const group =
    new THREE.Group();


  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        20,
        10,
        15
      ),
      mat(color)
    );

  body.position.y = 5;

  body.castShadow = true;

  group.add(body);


  const roof =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        22,
        1,
        17
      ),
      mat("#80686a")
    );

  roof.position.y = 10.5;

  group.add(roof);


  const sign =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        15,
        3,
        .4
      ),
      mat("#fff0bb")
    );

  sign.position.set(
    0,
    8,
    -7.7
  );

  group.add(sign);


  group.position.set(
    x,
    0,
    z
  );

  scene.add(group);


  restaurants.push({
    name,
    x,
    z,
    group
  });

}


makeRestaurant(
  "Doodle Burger",
  0,
  -45,
  "#e5ae92"
);

makeRestaurant(
  "Sunny Café",
  120,
  0,
  "#d8b3d7"
);

makeRestaurant(
  "Noodle House",
  -120,
  0,
  "#9fc4d5"
);


/* =========================================================
   FIRST PERSON CAR
========================================================= */

const car = {

  x:0,
  z:30,

  angle:Math.PI,

  speed:0,

  maxSpeed:.9,

  color:"#e99d92"

};


/*
  The camera is the driver's head.
*/

camera.position.set(
  0,
  3.1,
  0
);


/* Dashboard */

const dashboard =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      11,
      1.3,
      2
    ),
    mat("#393735")
  );

dashboard.position.set(
  0,
  -2.5,
  -1
);

camera.add(dashboard);


/* Hood */

const hood =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      8,
      .65,
      4
    ),
    mat(car.color)
  );

hood.position.set(
  0,
  -1.8,
  -6
);

camera.add(hood);


/* Windshield pillars */

for(
  const side of [-1,1]
) {

  const pillar =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .35,
        5,
        .4
      ),
      mat("#292827")
    );

  pillar.position.set(
    side*5,
    0,
    -2
  );

  camera.add(pillar);

}


/* Steering wheel */

const wheel =
  new THREE.Mesh(
    new THREE.TorusGeometry(
      1.1,
      .18,
      8,
      24
    ),
    mat("#242321")
  );

wheel.position.set(
  -2.8,
  -1.7,
  -2.6
);

wheel.rotation.x =
  Math.PI/2;

camera.add(wheel);


scene.add(camera);


/* =========================================================
   ORDER DATA
========================================================= */

const customerNames = [
  "Mia",
  "Lily",
  "Emma",
  "Noah",
  "Ava",
  "Sophie",
  "Ruby",
  "Ella"
];


let state = "waiting";

let currentRestaurant = null;
let currentHouse = null;

let earnedMoney = 0;

let deliveryPay = 0;


/* =========================================================
   INPUT
========================================================= */

const keys = {};

addEventListener(
  "keydown",
  e => {

    keys[
      e.key.toLowerCase()
    ] = true;

  }
);


addEventListener(
  "keyup",
  e => {

    keys[
      e.key.toLowerCase()
    ] = false;

  }
);


/* Mobile buttons */

function mobile(id,key) {

  const button =
    document.getElementById(id);

  button.addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();

      keys[key] = true;

    }
  );

  button.addEventListener(
    "pointerup",
    () => {

      keys[key] = false;

    }
  );

  button.addEventListener(
    "pointercancel",
    () => {

      keys[key] = false;

    }
  );

}

mobile("left","arrowleft");
mobile("right","arrowright");
mobile("gas","arrowup");
mobile("brake","arrowdown");


/* =========================================================
   START
========================================================= */

document.getElementById(
  "startButton"
).onclick = () => {

  document.getElementById(
    "start"
  ).style.display = "none";

  setTimeout(
    newOrder,
    1000
  );

};


/* =========================================================
   NEW ORDER
========================================================= */

function newOrder() {

  state = "waiting";

  currentRestaurant =
    restaurants[
      Math.floor(
        Math.random() *
        restaurants.length
      )
    ];


  currentHouse =
    houses[
      Math.floor(
        Math.random() *
        houses.length
      )
    ];


  const customer =
    customerNames[
      Math.floor(
        Math.random() *
        customerNames.length
      )
    ];


  deliveryPay =
    5 +
    Math.floor(
      Math.random()*7
    );


  document.getElementById(
    "notificationText"
  ).innerHTML =

    "<b>New delivery!</b><br><br>" +

    "🍔 Pick up from:<br>" +

    "<b>" +
    currentRestaurant.name +
    "</b><br><br>" +

    "🏠 Customer:<br>" +

    "<b>" +
    customer +
    "</b><br><br>" +

    "💵 Estimated pay: $" +
    deliveryPay.toFixed(2);


  document.getElementById(
    "phone"
  ).style.display = "block";


  document.getElementById(
    "objective"
  ).textContent =
    "📱 New order — check your phone!";

}


/* =========================================================
   ACCEPT ORDER
========================================================= */

document.getElementById(
  "acceptButton"
).onclick = () => {

  document.getElementById(
    "phone"
  ).style.display = "none";


  state = "toRestaurant";


  document.getElementById(
    "orderText"
  ).textContent =
    "Drive to " +
    currentRestaurant.name;


  document.getElementById(
    "objective"
  ).textContent =
    "🍔 Drive to the restaurant";


};


/* =========================================================
   INTERACTION
========================================================= */

function distanceTo(
  x,
  z
) {

  return Math.hypot(
    car.x-x,
    car.z-z
  );

}


function updateInteraction() {

  const box =
    document.getElementById(
      "interaction"
    );


  if(
    state === "toRestaurant" &&
    distanceTo(
      currentRestaurant.x,
      currentRestaurant.z
    ) < 17
  ) {

    box.style.display = "block";

    box.textContent =
      "Press E to pick up food 📦";

  }

  else if(
    state === "toCustomer" &&
    distanceTo(
      currentHouse.x,
      currentHouse.z
    ) < 14
  ) {

    box.style.display = "block";

    box.textContent =
      "Press E to drop off 📦";

  }

  else {

    box.style.display = "none";

  }

}


/* =========================================================
   INTERACT
========================================================= */

function interact() {

  if(
    state === "toRestaurant" &&
    distanceTo(
      currentRestaurant.x,
      currentRestaurant.z
    ) < 17
  ) {

    state = "toCustomer";


    document.getElementById(
      "orderText"
    ).textContent =
      "Deliver the food";


    document.getElementById(
      "objective"
    ).textContent =
      "📦 Food picked up — drive to the customer!";


    showMessage(
      "Order picked up! 📦"
    );

  }


  else if(
    state === "toCustomer" &&
    distanceTo(
      currentHouse.x,
      currentHouse.z
    ) < 14
  ) {

    state = "complete";


    earnedMoney += deliveryPay;


    document.getElementById(
      "money"
    ).textContent =
      earnedMoney.toFixed(2);


    document.getElementById(
      "orderText"
    ).textContent =
      "Delivery complete!";


    document.getElementById(
      "objective"
    ).textContent =
      "💵 Delivery complete!";


    showMessage(
      "Delivery complete!<br><br>" +
      "+$" +
      deliveryPay.toFixed(2) +
      " 💵"
    );


    setTimeout(
      newOrder,
      2200
    );

  }

}


addEventListener(
  "keydown",
  e => {

    if(
      e.key.toLowerCase() === "e"
    ) {

      interact();

    }

  }
);


/* =========================================================
   DRIVING
========================================================= */

function drive() {

  const gas =
    keys["w"] ||
    keys["arrowup"];

  const brake =
    keys["s"] ||
    keys["arrowdown"];

  const left =
    keys["a"] ||
    keys["arrowleft"];

  const right =
    keys["d"] ||
    keys["arrowright"];


  if(gas) {

    car.speed += .018;

  }

  else {

    car.speed *= .97;

  }


  if(brake) {

    car.speed -= .025;

  }


  car.speed =
    Math.max(
      -.3,
      Math.min(
        car.speed,
        car.maxSpeed
      )
    );


  if(
    Math.abs(car.speed) > .04
  ) {

    if(left)
      car.angle -= .035;

    if(right)
      car.angle += .035;

  }


  car.x +=
    Math.sin(car.angle) *
    car.speed;


  car.z +=
    Math.cos(car.angle) *
    car.speed;


  /* Keep player inside world */

  car.x =
    Math.max(
      -360,
      Math.min(
        360,
        car.x
      )
    );

  car.z =
    Math.max(
      -360,
      Math.min(
        360,
        car.z
      )
    );


  /* Update first-person camera */

  camera.position.x =
    car.x;

  camera.position.z =
    car.z;


  camera.rotation.y =
    car.angle;


  /* Tiny driving bounce */

  camera.position.y =
    3.1 +
    Math.sin(
      performance.now()*.012
    ) *
    Math.abs(car.speed) *
    .025;

}


/* =========================================================
   COLLISIONS
========================================================= */

function collisions() {

  /*
    Houses.
  */

  for(
    const house of houses
  ) {

    const d =
      distanceTo(
        house.x,
        house.z
      );


    if(d < 9) {

      car.speed *= -.35;

      showMessage(
        "BONK! 🏠<br>You hit a house!"
      );

    }

  }


  /*
    Trees.
  */

  for(
    const tree of trees
  ) {

    const d =
      distanceTo(
        tree.x,
        tree.z
      );


    if(d < 4.5) {

      car.speed *= -.35;

      showMessage(
        "BONK! 🌳<br>You hit a tree!"
      );

    }

  }

}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer;

function showMessage(text) {

  const box =
    document.getElementById(
      "message"
    );

  box.innerHTML = text;

  box.style.display = "block";


  clearTimeout(
    messageTimer
  );


  messageTimer =
    setTimeout(
      () => {

        box.style.display =
          "none";

      },
      1500
    );

}


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =========================================================
   GAME LOOP
========================================================= */

function loop() {

  requestAnimationFrame(
    loop
  );


  drive();

  collisions();

  updateInteraction();


  renderer.render(
    scene,
    camera
  );

}


loop();

</script>

</body>
</html>
