<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Doodle Dash</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@500;600;700&display=swap');

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #cfe5df;
  font-family: Quicksand, sans-serif;
  color: #51463f;
  touch-action: none;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

/* ---------------- HUD ---------------- */

#hud {
  position: fixed;
  top: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  z-index: 20;
  pointer-events: none;
}

.card {
  background: #fffaf0;
  border: 3px solid #51463f;
  border-radius: 16px;
  padding: 9px 13px;
  box-shadow: 3px 3px 0 #c8b6a5;
}

#customer {
  font-family: "Patrick Hand", cursive;
  font-size: 22px;
}

#address {
  font-size: 12px;
}

#direction {
  position: fixed;
  top: 105px;
  left: 50%;
  transform: translateX(-50%);
  background: #fffaf0;
  border: 3px solid #51463f;
  border-radius: 25px;
  padding: 8px 18px;
  font-family: "Patrick Hand", cursive;
  font-size: 21px;
  z-index: 20;
}

#shopButton {
  position: fixed;
  top: 105px;
  right: 14px;
  z-index: 25;

  background: #fffaf0;
  border: 3px solid #51463f;
  border-radius: 14px;
  padding: 8px 13px;

  font-family: "Patrick Hand", cursive;
  font-size: 20px;

  box-shadow: 3px 3px 0 #c8b6a5;
}

#deliver {
  display: none;

  position: fixed;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);

  z-index: 30;

  border: 3px solid #51463f;
  border-radius: 16px;

  background: #94b89b;
  color: white;

  padding: 12px 28px;

  font-family: "Patrick Hand", cursive;
  font-size: 25px;

  box-shadow: 3px 3px 0 #51463f;
}

/* ---------------- Controls ---------------- */

#controls {
  position: fixed;
  left: 18px;
  right: 18px;
  bottom: 18px;

  display: flex;
  justify-content: space-between;

  z-index: 30;
}

.controlGroup {
  display: flex;
  gap: 10px;
}

.control {
  width: 72px;
  height: 60px;

  border: 3px solid #51463f;
  border-radius: 18px;

  background: #fffaf0;

  font-family: "Patrick Hand", cursive;
  font-size: 28px;

  box-shadow: 3px 3px 0 #c8b6a5;
}

.control:active {
  transform: translateY(2px);
}

@media (pointer: fine) {
  #controls {
    display: none;
  }
}

/* ---------------- Start / Shop ---------------- */

.overlay {
  position: fixed;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(207, 229, 223, .97);

  z-index: 100;
}

.panel {
  width: min(92vw, 500px);

  background: #fffaf0;

  border: 4px solid #51463f;
  border-radius: 28px;

  padding: 28px;

  text-align: center;

  box-shadow: 7px 7px 0 #c8b6a5;
}

.title {
  margin: 0;
  font-family: "Patrick Hand", cursive;
  font-size: 58px;
}

.subtitle {
  color: #766b63;
}

.colorChoices {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 20px;
}

.colorButton {
  width: 42px;
  height: 42px;

  border-radius: 50%;
  border: 3px solid #51463f;

  cursor: pointer;
}

.mainButton {
  border: 3px solid #51463f;
  border-radius: 16px;

  padding: 12px 25px;

  background: #94b89b;
  color: white;

  font-family: "Patrick Hand", cursive;
  font-size: 25px;

  box-shadow: 3px 3px 0 #51463f;
}

#message {
  display: none;

  position: fixed;
  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  z-index: 200;

  background: #fffaf0;

  border: 3px solid #51463f;
  border-radius: 20px;

  padding: 18px 28px;

  text-align: center;

  font-family: "Patrick Hand", cursive;
  font-size: 29px;

  box-shadow: 5px 5px 0 #c8b6a5;
}
</style>
</head>

<body>

<canvas id="game"></canvas>


<!-- START SCREEN -->

<div class="overlay" id="startScreen">

  <div class="panel">

    <h1 class="title">
      Doodle Dash
    </h1>

    <p class="subtitle">
      Choose your delivery car ♡
    </p>

    <div
      id="preview"
      style="
        width:90px;
        height:130px;
        margin:20px auto;
        border:5px solid #51463f;
        border-radius:25px;
        background:#e99d92;
      ">
    </div>

    <div class="colorChoices">

      <button class="colorButton"
        style="background:#e99d92"
        onclick="chooseColor('#e99d92')"></button>

      <button class="colorButton"
        style="background:#9db9df"
        onclick="chooseColor('#9db9df')"></button>

      <button class="colorButton"
        style="background:#a9c99f"
        onclick="chooseColor('#a9c99f')"></button>

      <button class="colorButton"
        style="background:#d7b4df"
        onclick="chooseColor('#d7b4df')"></button>

      <button class="colorButton"
        style="background:#efc878"
        onclick="chooseColor('#efc878')"></button>

      <button class="colorButton"
        style="background:#eee9dc"
        onclick="chooseColor('#eee9dc')"></button>

    </div>

    <button class="mainButton" onclick="startGame()">
      Start Driving ♡
    </button>

  </div>

</div>


<!-- SHOP -->

<div class="overlay" id="shopScreen" style="display:none">

  <div class="panel">

    <h1 class="title">
      Car Shop
    </h1>

    <p>
      💵 $<span id="shopMoney">0</span>
    </p>

    <div class="colorChoices">

      <button class="colorButton"
        style="background:#e99d92"
        onclick="buyCar('#e99d92',0)"></button>

      <button class="colorButton"
        style="background:#9db9df"
        onclick="buyCar('#9db9df',25)"></button>

      <button class="colorButton"
        style="background:#a9c99f"
        onclick="buyCar('#a9c99f',35)"></button>

      <button class="colorButton"
        style="background:#d7b4df"
        onclick="buyCar('#d7b4df',50)"></button>

      <button class="colorButton"
        style="background:#efc878"
        onclick="buyCar('#efc878',75)"></button>

      <button class="colorButton"
        style="background:#eee9dc"
        onclick="buyCar('#eee9dc',100)"></button>

    </div>

    <p>
      Unlock cute new car colors with your delivery money!
    </p>

    <button class="mainButton" onclick="closeShop()">
      Back to driving
    </button>

  </div>

</div>


<!-- HUD -->

<div id="hud">

  <div class="card">

    <div id="customer">
      📦 Delivery
    </div>

    <div id="address">
      Finding address...
    </div>

  </div>

  <div class="card">

    💵 $<span id="money">0</span>

    <br>

    ⏱️ <span id="timer">60</span>

  </div>

</div>


<div id="direction">
  ↑ Find your customer
</div>


<button id="shopButton" onclick="openShop()">
  🚗 Cars
</button>


<button id="deliver" onclick="deliver()">
  Deliver ♡
</button>


<div id="message"></div>


<!-- MOBILE CONTROLS -->

<div id="controls">

  <div class="controlGroup">

    <button class="control" id="left">
      ←
    </button>

    <button class="control" id="right">
      →
    </button>

  </div>

  <div class="controlGroup">

    <button class="control" id="brake">
      ↓
    </button>

    <button class="control" id="gas">
      ↑
    </button>

  </div>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {

  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;

}

addEventListener("resize", resize);
resize();


/* =========================================================
   PLAYER
========================================================= */

const car = {

  x: 0,
  y: 0,

  angle: 0,

  speed: 0,

  maxSpeed: 5.8,

  color: "#e99d92"

};


/* =========================================================
   CAMERA
========================================================= */

const camera = {

  x: 0,
  y: 0,

  shake: 0

};


/* =========================================================
   INPUT
========================================================= */

const keys = {};

addEventListener("keydown", e => {

  keys[e.key.toLowerCase()] = true;

});

addEventListener("keyup", e => {

  keys[e.key.toLowerCase()] = false;

});


function mobileButton(id, key) {

  const button = document.getElementById(id);

  button.addEventListener("pointerdown", e => {

    e.preventDefault();

    keys[key] = true;

  });

  button.addEventListener("pointerup", () => {

    keys[key] = false;

  });

  button.addEventListener("pointercancel", () => {

    keys[key] = false;

  });

}

mobileButton("left", "arrowleft");
mobileButton("right", "arrowright");
mobileButton("gas", "arrowup");
mobileButton("brake", "arrowdown");


/* =========================================================
   CITY
========================================================= */

const roadX = [-900,-600,-300,0,300,600,900];
const roadY = [-900,-600,-300,0,300,600,900];

const roadWidth = 100;

const houses = [];
const trees = [];


/*
  IMPORTANT:

  Houses and trees are created only inside
  neighborhood blocks.

  Nothing randomly spawns on the roads.
*/


const houseColors = [
  "#efc5bb",
  "#e8d7aa",
  "#c7ddc2",
  "#d8c6e4",
  "#e8c8a5",
  "#c4dce0"
];


/* =========================================================
   CREATE BLOCKS
========================================================= */

for (let bx = -1050; bx <= 900; bx += 300) {

  for (let by = -1050; by <= 900; by += 300) {

    /*
      Four houses per block.
    */

    const positions = [

      [bx + 70, by + 70],
      [bx + 230, by + 70],
      [bx + 70, by + 230],
      [bx + 230, by + 230]

    ];

    positions.forEach(([x,y]) => {

      houses.push({

        x,
        y,

        color:
          houseColors[
            Math.floor(
              Math.random() *
              houseColors.length
            )
          ],

        roof:
          Math.random() > .5
            ? "#bd8079"
            : "#77748b"

      });

    });


    /*
      Trees are placed beside houses,
      not on roads.
    */

    for (let i = 0; i < 5; i++) {

      trees.push({

        x:
          bx +
          30 +
          Math.random()*240,

        y:
          by +
          30 +
          Math.random()*240,

        size:
          14 +
          Math.random()*10

      });

    }

  }

}


/* =========================================================
   CUSTOMERS
========================================================= */

const customers = [

  ["Mia","Maple Street"],
  ["Lily","Rose Avenue"],
  ["Emma","Sunny Lane"],
  ["Noah","Pine Road"],
  ["Ava","Cloud Street"],
  ["Sophie","Willow Way"],
  ["Ruby","Meadow Street"],
  ["Ella","Garden Drive"]

];

let customer;
let target;

let money = 0;
let time = 60;

let deliveryDone = false;
let timer;


/* =========================================================
   START
========================================================= */

function chooseColor(color) {

  car.color = color;

  document.getElementById("preview")
    .style.background = color;

}


function startGame() {

  document.getElementById("startScreen")
    .style.display = "none";

  newOrder();

}


/* =========================================================
   ORDER
========================================================= */

function newOrder() {

  deliveryDone = false;

  customer =
    customers[
      Math.floor(
        Math.random() *
        customers.length
      )
    ];

  target =
    houses[
      Math.floor(
        Math.random() *
        houses.length
      )
    ];

  time = 60;

  document.getElementById("customer")
    .textContent =
      "📦 Delivery for " +
      customer[0];

  document.getElementById("address")
    .textContent =
      customer[1];

  document.getElementById("deliver")
    .style.display = "none";

  clearInterval(timer);

  timer = setInterval(() => {

    if (deliveryDone) return;

    time--;

    document.getElementById("timer")
      .textContent =
        Math.max(0,time);

    if (time <= 0) {

      clearInterval(timer);

      showMessage(
        "You ran out of time! 😭"
      );

      setTimeout(newOrder, 1500);

    }

  },1000);

}


/* =========================================================
   ROAD CHECK
========================================================= */


/*
  Returns true when the car is on a road.

  This makes the world feel more like
  an actual neighborhood instead of
  letting the player drive everywhere.
*/

function onRoad(x,y) {

  for (const r of roadX) {

    if (Math.abs(x-r) < roadWidth/2)
      return true;

  }

  for (const r of roadY) {

    if (Math.abs(y-r) < roadWidth/2)
      return true;

  }

  return false;

}


/* =========================================================
   COLLISIONS
========================================================= */

let crashCooldown = 0;

function checkCollision() {

  if (crashCooldown > 0) {

    crashCooldown--;

    return;

  }


  /*
    Houses.
  */

  for (const house of houses) {

    const distance =
      Math.hypot(
        car.x-house.x,
        car.y-house.y
      );

    if (distance < 48) {

      crash(
        "BONK! You hit a house! 🏠"
      );

      return;

    }

  }


  /*
    Trees.
  */

  for (const tree of trees) {

    const distance =
      Math.hypot(
        car.x-tree.x,
        car.y-tree.y
      );

    if (
      distance <
      tree.size + 20
    ) {

      crash(
        "BONK! You hit a tree! 🌳"
      );

      return;

    }

  }

}


function crash(text) {

  crashCooldown = 35;

  car.speed = 0;

  /*
    Push the car backward.
  */

  car.x -=
    Math.sin(car.angle) * 25;

  car.y +=
    Math.cos(car.angle) * 25;

  /*
    Crash costs $1.
  */

  if (money > 0)
    money--;

  document.getElementById("money")
    .textContent = money;

  camera.shake = 12;

  showMessage(
    text + "<br>-$1"
  );

}


/* =========================================================
   DRIVING
========================================================= */

function drive() {

  const gas =
    keys["w"] ||
    keys["arrowup"];

  const brake =
    keys["s"] ||
    keys["arrowdown"];

  const left =
    keys["a"] ||
    keys["arrowleft"];

  const right =
    keys["d"] ||
    keys["arrowright"];


  /*
    Accelerate.
  */

  if (gas) {

    car.speed += .15;

  } else {

    car.speed *= .965;

  }


  /*
    Brake / reverse.
  */

  if (brake) {

    car.speed -= .20;

  }


  car.speed =
    Math.max(
      -2,
      Math.min(
        car.speed,
        car.maxSpeed
      )
    );


  /*
    Steering.
  */

  if (Math.abs(car.speed) > .1) {

    if (left)
      car.angle -= .045;

    if (right)
      car.angle += .045;

  }


  /*
    Save previous position.

    This lets us stop the car if it
    hits something.
  */

  const oldX = car.x;
  const oldY = car.y;


  car.x +=
    Math.sin(car.angle) *
    car.speed;

  car.y +=
    -Math.cos(car.angle) *
    car.speed;


  /*
    Keep the player inside the city.
  */

  car.x =
    Math.max(
      -1150,
      Math.min(1150,car.x)
    );

  car.y =
    Math.max(
      -1150,
      Math.min(1150,car.y)
    );


  /*
    Collision.
  */

  checkCollision();

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

  /*
    Camera is behind and above the car.

    This is the third-person Roblox-like
    perspective rather than bird's-eye.
  */

  const followDistance = 155;

  const desiredX =
    car.x -
    Math.sin(car.angle) *
    followDistance;

  const desiredY =
    car.y +
    Math.cos(car.angle) *
    followDistance;


  camera.x +=
    (desiredX-camera.x) *
    .09;

  camera.y +=
    (desiredY-camera.y) *
    .09;


  /*
    Crash shake.
  */

  if (camera.shake > 0) {

    camera.x +=
      (Math.random()-.5) *
      camera.shake;

    camera.y +=
      (Math.random()-.5) *
      camera.shake;

    camera.shake *= .8;

  }

}


/* =========================================================
   DRAW CITY
========================================================= */

function drawWorld() {

  ctx.clearRect(0,0,W,H);


  ctx.save();

  ctx.translate(
    W/2-camera.x,
    H/2-camera.y
  );


  /*
    GRASS
  */

  ctx.fillStyle = "#b8d2ad";

  ctx.fillRect(
    -1300,
    -1300,
    2600,
    2600
  );


  /*
    SIDEWALKS
  */

  roadX.forEach(x => {

    ctx.fillStyle = "#d8d0c5";

    ctx.fillRect(
      x-62,
      -1300,
      124,
      2600
    );

  });

  roadY.forEach(y => {

    ctx.fillStyle = "#d8d0c5";

    ctx.fillRect(
      -1300,
      y-62,
      2600,
      124
    );

  });


  /*
    ROADS
  */

  roadX.forEach(x => {

    ctx.fillStyle = "#8e8c89";

    ctx.fillRect(
      x-50,
      -1300,
      100,
      2600
    );

  });

  roadY.forEach(y => {

    ctx.fillStyle = "#8e8c89";

    ctx.fillRect(
      -1300,
      y-50,
      2600,
      100
    );

  });


  /*
    CENTER LINES
  */

  ctx.strokeStyle = "#eee3c8";
  ctx.lineWidth = 4;
  ctx.setLineDash([25,25]);

  roadX.forEach(x => {

    ctx.beginPath();

    ctx.moveTo(x,-1300);
    ctx.lineTo(x,1300);

    ctx.stroke();

  });

  roadY.forEach(y => {

    ctx.beginPath();

    ctx.moveTo(-1300,y);
    ctx.lineTo(1300,y);

    ctx.stroke();

  });

  ctx.setLineDash([]);


  /*
    CROSSWALKS
  */

  roadX.forEach(x => {

    roadY.forEach(y => {

      ctx.fillStyle = "#e9e3d8";

      for (let i=-35;i<=35;i+=14) {

        ctx.fillRect(
          x+i,
          y-62,
          8,
          12
        );

      }

    });

  });


  /*
    TREES
  */

  trees.forEach(tree => {

    /*
      Only draw nearby trees.
    */

    if (
      Math.abs(tree.x-camera.x)>850 ||
      Math.abs(tree.y-camera.y)>650
    )
      return;


    ctx.fillStyle = "#75614f";

    ctx.fillRect(
      tree.x-3,
      tree.y,
      6,
      20
    );


    ctx.fillStyle = "#789b71";

    ctx.beginPath();

    ctx.arc(
      tree.x,
      tree.y,
      tree.size,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle = "#51463f";
    ctx.lineWidth = 3;
    ctx.stroke();

  });


  /*
    HOUSES
  */

  houses.forEach(house => {

    if (
      Math.abs(house.x-camera.x)>850 ||
      Math.abs(house.y-camera.y)>650
    )
      return;


    /*
      Small driveway.
    */

    ctx.fillStyle = "#bcb6ac";

    ctx.fillRect(
      house.x-15,
      house.y+28,
      30,
      50
    );


    /*
      House body.
    */

    ctx.fillStyle = house.color;

    ctx.strokeStyle = "#51463f";

    ctx.lineWidth = 4;

    ctx.fillRect(
      house.x-38,
      house.y-30,
      76,
      62
    );

    ctx.strokeRect(
      house.x-38,
      house.y-30,
      76,
      62
    );


    /*
      Roof.
    */

    ctx.fillStyle = house.roof;

    ctx.beginPath();

    ctx.moveTo(
      house.x-48,
      house.y-30
    );

    ctx.lineTo(
      house.x,
      house.y-70
    );

    ctx.lineTo(
      house.x+48,
      house.y-30
    );

    ctx.closePath();

    ctx.fill();
    ctx.stroke();


    /*
      Door.
    */

    ctx.fillStyle = "#a77763";

    ctx.fillRect(
      house.x-9,
      house.y+3,
      18,
      29
    );

    ctx.strokeRect(
      house.x-9,
      house.y+3,
      18,
      29
    );


    /*
      Windows.
    */

    ctx.fillStyle = "#f6e5a9";

    ctx.fillRect(
      house.x-29,
      house.y-18,
      17,
      17
    );

    ctx.fillRect(
      house.x+12,
      house.y-18,
      17,
      17
    );

  });


  /*
    DELIVERY MARKER
  */

  if (target && !deliveryDone) {

    const distance =
      Math.hypot(
        target.x-car.x,
        target.y-car.y
      );

    if (distance < 650) {

      ctx.strokeStyle = "#df8b82";
      ctx.lineWidth = 5;

      ctx.beginPath();

      ctx.arc(
        target.x,
        target.y-90,
        18,
        0,
        Math.PI*2
      );

      ctx.stroke();

      ctx.fillStyle = "#df8b82";

      ctx.font =
        "bold 22px Patrick Hand";

      ctx.textAlign = "center";

      ctx.fillText(
        "DELIVER",
        target.x,
        target.y-118
      );

    }

  }


  /*
    CAR
  */

  drawCar();


  ctx.restore();

}


/* =========================================================
   DRAW CAR
========================================================= */

function drawCar() {

  ctx.save();

  ctx.translate(
    car.x,
    car.y
  );

  ctx.rotate(car.angle);


  /*
    Shadow.
  */

  ctx.fillStyle =
    "rgba(50,45,40,.25)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    10,
    29,
    47,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    Wheels.
  */

  ctx.fillStyle = "#4d4742";

  ctx.fillRect(
    -28,-24,
    9,21
  );

  ctx.fillRect(
    19,-24,
    9,21
  );

  ctx.fillRect(
    -28,8,
    9,21
  );

  ctx.fillRect(
    19,8,
    9,21
  );


  /*
    Body.
  */

  ctx.fillStyle = car.color;

  ctx.strokeStyle = "#51463f";

  ctx.lineWidth = 4;

  ctx.beginPath();

  ctx.roundRect(
    -24,
    -37,
    48,
    74,
    14
  );

  ctx.fill();
  ctx.stroke();


  /*
    Roof.
  */

  ctx.beginPath();

  ctx.roundRect(
    -18,
    -17,
    36,
    39,
    9
  );

  ctx.fill();
  ctx.stroke();


  /*
    Windows.
  */

  ctx.fillStyle = "#b9d8d7";

  ctx.beginPath();

  ctx.roundRect(
    -15,
    -14,
    30,
    20,
    5
  );

  ctx.fill();
  ctx.stroke();


  ctx.beginPath();

  ctx.roundRect(
    -14,
    8,
    28,
    11,
    4
  );

  ctx.fill();
  ctx.stroke();


  /*
    Headlights.
  */

  ctx.fillStyle = "#f5df8c";

  ctx.beginPath();

  ctx.arc(
    -14,
    -32,
    5,
    0,
    Math.PI*2
  );

  ctx.arc(
    14,
    -32,
    5,
    0,
    Math.PI*2
  );

  ctx.fill();
  ctx.stroke();


  /*
    Little delivery sign.
  */

  ctx.fillStyle = "#fffaf0";

  ctx.beginPath();

  ctx.roundRect(
    -16,
    -50,
    32,
    12,
    5
  );

  ctx.fill();
  ctx.stroke();


  ctx.restore();

}


/* =========================================================
   DIRECTION
========================================================= */

function updateDirection() {

  if (!target)
    return;


  const dx =
    target.x-car.x;

  const dy =
    target.y-car.y;

  const distance =
    Math.hypot(dx,dy);


  if (distance < 75) {

    document.getElementById("direction")
      .textContent =
        "🏠 You're here!";

    document.getElementById("deliver")
      .style.display =
        "block";

    return;

  }


  let targetAngle =
    Math.atan2(
      dx,
      -dy
    );


  let difference =
    targetAngle-car.angle;


  while (difference > Math.PI)
    difference -= Math.PI*2;

  while (difference < -Math.PI)
    difference += Math.PI*2;


  let arrow = "↑";

  if (difference > .4)
    arrow = "↗";

  if (difference > 1.2)
    arrow = "→";

  if (difference < -.4)
    arrow = "↖";

  if (difference < -1.2)
    arrow = "←";


  document.getElementById("direction")
    .textContent =
      arrow +
      " " +
      Math.round(distance) +
      "m";

}


/* =========================================================
   DELIVERY
========================================================= */

function deliver() {

  if (deliveryDone)
    return;


  const distance =
    Math.hypot(
      target.x-car.x,
      target.y-car.y
    );


  if (distance > 75) {

    showMessage(
      "You're not at the house yet!"
    );

    return;

  }


  if (Math.abs(car.speed) > .7) {

    showMessage(
      "Stop the car first! 🚗"
    );

    return;

  }


  deliveryDone = true;

  clearInterval(timer);


  const earned =
    6 +
    Math.max(
      1,
      Math.floor(time/8)
    );


  money += earned;


  document.getElementById("money")
    .textContent = money;


  document.getElementById("deliver")
    .style.display = "none";


  showMessage(
    "Delivery complete! ♡<br>+$" +
    earned
  );


  setTimeout(
    newOrder,
    1800
  );

}


/* =========================================================
   CAR SHOP
========================================================= */

function openShop() {

  document.getElementById("shopScreen")
    .style.display = "flex";

  document.getElementById("shopMoney")
    .textContent = money;

}


function closeShop() {

  document.getElementById("shopScreen")
    .style.display = "none";

}


function buyCar(color, price) {

  if (price === 0) {

    car.color = color;

    return;

  }


  if (money < price) {

    showMessage(
      "You need $" +
      (price-money) +
      " more! 💵"
    );

    return;

  }


  money -= price;

  car.color = color;


  document.getElementById("money")
    .textContent = money;

  document.getElementById("shopMoney")
    .textContent = money;


  showMessage(
    "New car unlocked! 🚗♡"
  );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text) {

  const box =
    document.getElementById("message");

  box.innerHTML = text;

  box.style.display = "block";

  clearTimeout(box.hide);

  box.hide =
    setTimeout(
      () => {
        box.style.display = "none";
      },
      1500
    );

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

  drive();

  updateCamera();

  updateDirection();

  drawWorld();

  requestAnimationFrame(gameLoop);

}

gameLoop();

</script>
