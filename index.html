<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Doodle Dash</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@500;600;700&display=swap');

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  overflow: hidden;
  background: #dcebe4;
  font-family: Quicksand, sans-serif;
  color: #4d433d;
  touch-action: none;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

/* HUD */

#hud {
  position: fixed;
  top: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  z-index: 10;
  pointer-events: none;
}

.card {
  background: #fffaf1;
  border: 3px solid #514943;
  border-radius: 16px;
  padding: 9px 14px;
  box-shadow: 3px 3px 0 #cdbbaa;
}

#orderCard {
  max-width: 300px;
}

#customer {
  font-family: "Patrick Hand", cursive;
  font-size: 23px;
}

#address {
  font-size: 13px;
}

#money {
  font-weight: bold;
}

/* direction */

#direction {
  position: fixed;
  top: 115px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;

  background: #fffaf1;
  border: 3px solid #514943;
  border-radius: 30px;

  padding: 8px 18px;

  font-family: "Patrick Hand", cursive;
  font-size: 22px;

  pointer-events: none;
}

/* delivery */

#deliver {
  position: fixed;
  left: 50%;
  bottom: 135px;
  transform: translateX(-50%);

  display: none;

  background: #9dbba2;
  color: white;

  border: 3px solid #514943;
  border-radius: 18px;

  padding: 12px 28px;

  font-family: "Patrick Hand", cursive;
  font-size: 26px;

  box-shadow: 3px 3px 0 #514943;
  z-index: 20;
}

/* message */

#message {
  position: fixed;
  left: 50%;
  top: 48%;
  transform: translate(-50%,-50%);

  background: #fffaf1;
  border: 3px solid #514943;
  border-radius: 18px;

  padding: 15px 25px;

  font-family: "Patrick Hand", cursive;
  font-size: 28px;
  text-align: center;

  display: none;
  z-index: 30;
}

/* controls */

#controls {
  position: fixed;
  left: 18px;
  right: 18px;
  bottom: 18px;

  display: flex;
  justify-content: space-between;

  z-index: 20;
  pointer-events: none;
}

.controlGroup {
  display: flex;
  gap: 9px;
}

.control {
  width: 65px;
  height: 58px;

  border: 3px solid #514943;
  border-radius: 17px;

  background: #fffaf1;

  font-family: "Patrick Hand", cursive;
  font-size: 25px;

  box-shadow: 3px 3px 0 #cdbbaa;

  pointer-events: auto;
}

.control:active {
  transform: translateY(2px);
}

@media (pointer: coarse) {
  #controls {
    display: flex;
  }
}

@media (pointer: fine) {
  #controls {
    display: none;
  }
}

@media(max-width:600px) {

  #orderCard {
    max-width: 210px;
  }

  .card {
    padding: 7px 10px;
    font-size: 12px;
  }

  #customer {
    font-size: 20px;
  }

  #direction {
    top: 100px;
    font-size: 19px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div class="card" id="orderCard">
    <div id="customer">Loading...</div>
    <div id="address">Finding customer...</div>
  </div>

  <div class="card">
    💵 $<span id="money">0</span><br>
    ⏱️ <span id="timer">60</span>s
  </div>

</div>

<div id="direction">
  Find your customer ↑
</div>

<button id="deliver" onclick="deliverFood()">
  Deliver ♡
</button>

<div id="message"></div>

<div id="controls">

  <div class="controlGroup">
    <button class="control" id="left">←</button>
    <button class="control" id="right">→</button>
  </div>

  <div class="controlGroup">
    <button class="control" id="brake">↓</button>
    <button class="control" id="gas">↑</button>
  </div>

</div>


<script>

/* =====================================================
   DOODLE DASH
   ===================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


/* =====================================================
   PLAYER
   ===================================================== */

const player = {
  x: 0,
  y: 0,

  angle: 0,

  speed: 0,

  width: 32,
  height: 52
};


/* =====================================================
   WORLD
   ===================================================== */

/*
  Streets form a big grid.

  This makes the world feel like a collection
  of neighborhoods rather than one long road.
*/

const roadWidth = 120;

const streetsX = [
  -900,
  -600,
  -300,
  0,
  300,
  600,
  900
];

const streetsY = [
  -900,
  -600,
  -300,
  0,
  300,
  600,
  900
];

const worldSize = 1200;


/* =====================================================
   HOUSES
   ===================================================== */

let houses = [];

const houseColors = [
  "#f0c5bd",
  "#e8d6a8",
  "#c9ddc2",
  "#d7c4e5",
  "#efcfae",
  "#c7dce3"
];

function makeHouses() {

  houses = [];

  /*
    Put houses in the spaces between streets.
  */

  for (let x = -1050; x <= 1050; x += 150) {

    for (let y = -1050; y <= 1050; y += 150) {

      /*
        Don't put houses directly on roads.
      */

      const nearRoadX =
        streetsX.some(s => Math.abs(x - s) < 75);

      const nearRoadY =
        streetsY.some(s => Math.abs(y - s) < 75);

      if (nearRoadX || nearRoadY)
        continue;

      houses.push({
        x,
        y,

        width: 75,
        height: 65,

        color:
          houseColors[
            Math.floor(
              Math.random() * houseColors.length
            )
          ],

        roof:
          Math.random() > .5 ? "#c98278" : "#817d91"
      });

    }
  }
}

makeHouses();


/* =====================================================
   TREES
   ===================================================== */

let trees = [];

function makeTrees() {

  trees = [];

  for (let i = 0; i < 130; i++) {

    trees.push({

      x:
        Math.random() *
        2100 - 1050,

      y:
        Math.random() *
        2100 - 1050,

      size:
        18 + Math.random() * 12

    });

  }

}

makeTrees();


/* =====================================================
   CUSTOMER
   ===================================================== */

const customers = [
  ["Mia", "Maple Street"],
  ["Lily", "Rose Avenue"],
  ["Emma", "Sunny Lane"],
  ["Noah", "Pine Road"],
  ["Ava", "Cloud Street"],
  ["Sophie", "Willow Way"],
  ["Ella", "Garden Drive"],
  ["Ruby", "Meadow Street"]
];

let currentCustomer;

let targetHouse;

let money = 0;

let timeLeft = 60;

let delivered = false;


/* =====================================================
   NEW DELIVERY
   ===================================================== */

function newDelivery() {

  delivered = false;

  document.getElementById("deliver")
    .style.display = "none";

  currentCustomer =
    customers[
      Math.floor(
        Math.random() *
        customers.length
      )
    ];


  /*
    Pick a random house.
  */

  targetHouse =
    houses[
      Math.floor(
        Math.random() *
        houses.length
      )
    ];


  document.getElementById("customer")
    .textContent =
      "📦 Delivery for " +
      currentCustomer[0];

  document.getElementById("address")
    .textContent =
      currentCustomer[1] +
      " • House " +
      Math.floor(
        Math.random() * 20 + 1
      );


  timeLeft = 60;

  document.getElementById("timer")
    .textContent =
      timeLeft;

  startTimer();

}


/* =====================================================
   TIMER
   ===================================================== */

let timerInterval;

function startTimer() {

  clearInterval(timerInterval);

  timerInterval =
    setInterval(() => {

      if (delivered)
        return;

      timeLeft--;

      document.getElementById("timer")
        .textContent =
          Math.max(0, timeLeft);

      if (timeLeft <= 0) {

        clearInterval(timerInterval);

        showMessage(
          "Too slow! They went inside 😭"
        );

        setTimeout(
          newDelivery,
          1500
        );

      }

    }, 1000);

}


/* =====================================================
   KEYBOARD
   ===================================================== */

const keys = {};

document.addEventListener(
  "keydown",
  e => {

    keys[e.key.toLowerCase()] = true;

    if (
      e.key === " " ||
      e.key === "ArrowUp" ||
      e.key === "ArrowDown" ||
      e.key === "ArrowLeft" ||
      e.key === "ArrowRight"
    ) {
      e.preventDefault();
    }

    if (e.key.toLowerCase() === "e") {
      deliverFood();
    }

  }
);

document.addEventListener(
  "keyup",
  e => {

    keys[e.key.toLowerCase()] = false;

  }
);


/* =====================================================
   TOUCH
   ===================================================== */

function hold(id, name) {

  const button =
    document.getElementById(id);

  button.addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();

      keys[name] = true;

    }
  );

  button.addEventListener(
    "pointerup",
    () => {

      keys[name] = false;

    }
  );

  button.addEventListener(
    "pointercancel",
    () => {

      keys[name] = false;

    }
  );

}

hold("left", "arrowleft");
hold("right", "arrowright");
hold("gas", "arrowup");
hold("brake", "arrowdown");


/* =====================================================
   CAR PHYSICS
   ===================================================== */

function updatePlayer() {

  const forward =
    keys["arrowup"] ||
    keys["w"];

  const brake =
    keys["arrowdown"] ||
    keys["s"];

  const left =
    keys["arrowleft"] ||
    keys["a"];

  const right =
    keys["arrowright"] ||
    keys["d"];


  /* acceleration */

  if (forward) {

    player.speed += .18;

  } else {

    player.speed *= .96;

  }


  /* braking */

  if (brake) {

    player.speed *= .88;

  }


  player.speed =
    Math.max(
      -1.5,
      Math.min(
        player.speed,
        5.5
      )
    );


  /*
    Steering becomes stronger
    when the car is moving.
  */

  if (Math.abs(player.speed) > .1) {

    if (left)
      player.angle -=
        .035 *
        Math.abs(player.speed);

    if (right)
      player.angle +=
        .035 *
        Math.abs(player.speed);

  }


  /*
    Move car.
  */

  player.x +=
    Math.sin(player.angle) *
    player.speed;

  player.y +=
    -Math.cos(player.angle) *
    player.speed;


  /*
    World boundaries.
  */

  player.x =
    Math.max(
      -1100,
      Math.min(
        1100,
        player.x
      )
    );

  player.y =
    Math.max(
      -1100,
      Math.min(
        1100,
        player.y
      )
    );

}


/* =====================================================
   ROAD CHECK
   ===================================================== */

function isOnRoad(x, y) {

  const onX =
    streetsX.some(
      s => Math.abs(x - s) < roadWidth / 2
    );

  const onY =
    streetsY.some(
      s => Math.abs(y - s) < roadWidth / 2
    );

  return onX || onY;
}


/* =====================================================
   DRAW WORLD
   ===================================================== */

function drawWorld() {

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    Sky / ground
  */

  ctx.fillStyle = "#cfe7e3";
  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
    Camera follows player.
  */

  const cameraX =
    player.x;

  const cameraY =
    player.y;


  /*
    Ground
  */

  ctx.save();

  ctx.translate(
    W / 2 - cameraX,
    H / 2 - cameraY
  );


  ctx.fillStyle = "#b9d0ad";

  ctx.fillRect(
    -1300,
    -1300,
    2600,
    2600
  );


  /*
    Sidewalks / roads
  */

  streetsX.forEach(x => {

    ctx.fillStyle = "#d9d1c7";

    ctx.fillRect(
      x - 70,
      -1200,
      140,
      2400
    );

    ctx.fillStyle = "#9d9b98";

    ctx.fillRect(
      x - 55,
      -1200,
      110,
      2400
    );

  });


  streetsY.forEach(y => {

    ctx.fillStyle = "#d9d1c7";

    ctx.fillRect(
      -1200,
      y - 70,
      2400,
      140
    );

    ctx.fillStyle = "#9d9b98";

    ctx.fillRect(
      -1200,
      y - 55,
      2400,
      110
    );

  });


  /*
    Road markings
  */

  ctx.strokeStyle = "#eee3c8";
  ctx.lineWidth = 5;
  ctx.setLineDash([28,28]);

  streetsX.forEach(x => {

    ctx.beginPath();

    ctx.moveTo(
      x,
      -1200
    );

    ctx.lineTo(
      x,
      1200
    );

    ctx.stroke();

  });


  streetsY.forEach(y => {

    ctx.beginPath();

    ctx.moveTo(
      -1200,
      y
    );

    ctx.lineTo(
      1200,
      y
    );

    ctx.stroke();

  });

  ctx.setLineDash([]);


  /*
    Trees
  */

  trees.forEach(tree => {

    /*
      Only draw nearby trees.
    */

    if (
      Math.abs(tree.x - cameraX) > 700 ||
      Math.abs(tree.y - cameraY) > 500
    )
      return;


    ctx.fillStyle = "#765f4e";

    ctx.fillRect(
      tree.x - 4,
      tree.y,
      8,
      25
    );

    ctx.fillStyle = "#789d71";

    ctx.beginPath();

    ctx.arc(
      tree.x,
      tree.y,
      tree.size,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle = "#514943";
    ctx.lineWidth = 3;
    ctx.stroke();

  });


  /*
    Houses
  */

  houses.forEach(house => {

    if (
      Math.abs(house.x - cameraX) > 800 ||
      Math.abs(house.y - cameraY) > 600
    )
      return;


    /* house */

    ctx.fillStyle =
      house.color;

    ctx.strokeStyle =
      "#514943";

    ctx.lineWidth = 4;

    ctx.fillRect(
      house.x - house.width / 2,
      house.y - house.height / 2,
      house.width,
      house.height
    );

    ctx.strokeRect(
      house.x - house.width / 2,
      house.y - house.height / 2,
      house.width,
      house.height
    );


    /*
      roof
    */

    ctx.fillStyle =
      house.roof;

    ctx.beginPath();

    ctx.moveTo(
      house.x - 48,
      house.y - 32
    );

    ctx.lineTo(
      house.x,
      house.y - 72
    );

    ctx.lineTo(
      house.x + 48,
      house.y - 32
    );

    ctx.closePath();

    ctx.fill();
    ctx.stroke();


    /*
      door
    */

    ctx.fillStyle =
      "#a87562";

    ctx.fillRect(
      house.x - 9,
      house.y + 4,
      18,
      30
    );

    ctx.strokeRect(
      house.x - 9,
      house.y + 4,
      18,
      30
    );


    /*
      windows
    */

    ctx.fillStyle =
      "#f8e7aa";

    ctx.fillRect(
      house.x - 30,
      house.y - 20,
      18,
      18
    );

    ctx.fillRect(
      house.x + 12,
      house.y - 20,
      18,
      18
    );

  });


  /*
    Target house marker
  */

  if (targetHouse && !delivered) {

    const d =
      Math.hypot(
        targetHouse.x - player.x,
        targetHouse.y - player.y
      );


    if (d < 650) {

      ctx.strokeStyle =
        "#e38c82";

      ctx.lineWidth = 5;

      ctx.beginPath();

      ctx.arc(
        targetHouse.x,
        targetHouse.y - 85,
        18,
        0,
        Math.PI * 2
      );

      ctx.stroke();


      ctx.fillStyle =
        "#e38c82";

      ctx.font =
        "bold 24px Patrick Hand";

      ctx.textAlign =
        "center";

      ctx.fillText(
        "DROP OFF",
        targetHouse.x,
        targetHouse.y - 110
      );

    }

  }


  /*
    Car
  */

  drawCar(
    player.x,
    player.y,
    player.angle
  );


  ctx.restore();

}


/* =====================================================
   DRAW CAR
   ===================================================== */

function drawCar(x, y, angle) {

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.rotate(angle);


  /*
    shadow
  */

  ctx.fillStyle =
    "rgba(70,60,50,.2)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    5,
    24,
    38,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /*
    body
  */

  ctx.fillStyle =
    "#e89c91";

  ctx.strokeStyle =
    "#514943";

  ctx.lineWidth = 4;

  ctx.beginPath();

  ctx.roundRect(
    -22,
    -30,
    44,
    60,
    11
  );

  ctx.fill();
  ctx.stroke();


  /*
    windshield
  */

  ctx.fillStyle =
    "#b9d9d8";

  ctx.beginPath();

  ctx.roundRect(
    -16,
    -18,
    32,
    20,
    5
  );

  ctx.fill();
  ctx.stroke();


  /*
    back window
  */

  ctx.beginPath();

  ctx.roundRect(
    -15,
    6,
    30,
    13,
    4
  );

  ctx.fill();
  ctx.stroke();


  /*
    headlights
  */

  ctx.fillStyle =
    "#f5dc8a";

  ctx.beginPath();

  ctx.arc(
    -13,
    -27,
    5,
    0,
    Math.PI * 2
  );

  ctx.arc(
    13,
    -27,
    5,
    0,
    Math.PI * 2
  );

  ctx.fill();
  ctx.stroke();


  /*
    wheels
  */

  ctx.fillStyle =
    "#514943";

  ctx.fillRect(
    -27,
    -18,
    8,
    18
  );

  ctx.fillRect(
    19,
    -18,
    8,
    18
  );

  ctx.fillRect(
    -27,
    5,
    8,
    18
  );

  ctx.fillRect(
    19,
    5,
    8,
    18
  );


  /*
    delivery sign
  */

  ctx.fillStyle =
    "#fffaf1";

  ctx.beginPath();

  ctx.roundRect(
    -15,
    -42,
    30,
    12,
    5
  );

  ctx.fill();
  ctx.stroke();


  ctx.restore();

}


/* =====================================================
   DISTANCE TO HOUSE
   ===================================================== */

function distanceToTarget() {

  if (!targetHouse)
    return 9999;

  return Math.hypot(
    targetHouse.x - player.x,
    targetHouse.y - player.y
  );

}


/* =====================================================
   DIRECTION
   ===================================================== */

function updateDirection() {

  if (!targetHouse)
    return;


  const dx =
    targetHouse.x -
    player.x;

  const dy =
    targetHouse.y -
    player.y;


  const distance =
    Math.hypot(
      dx,
      dy
    );


  /*
    If close enough:
  */

  if (distance < 75) {

    document.getElementById(
      "direction"
    ).textContent =
      "🏠 You're here!";

    document.getElementById(
      "deliver"
    ).style.display =
      "block";

    return;

  }


  /*
    Work out whether target
    is left/right/forward/back.
  */

  let targetAngle =
    Math.atan2(
      dx,
      -dy
    );


  let difference =
    targetAngle -
    player.angle;


  while (difference > Math.PI)
    difference -= Math.PI * 2;

  while (difference < -Math.PI)
    difference += Math.PI * 2;


  let arrow = "↑";


  if (difference > .4)
    arrow = "↗";

  if (difference > 1.2)
    arrow = "→";

  if (difference < -.4)
    arrow = "↖";

  if (difference < -1.2)
    arrow = "←";


  document.getElementById(
    "direction"
  ).textContent =
    arrow +
    " " +
    Math.round(distance) +
    "m";

}


/* =====================================================
   DELIVERY
   ===================================================== */

function deliverFood() {

  if (delivered)
    return;


  const distance =
    distanceToTarget();


  if (distance > 75) {

    showMessage(
      "You're not at the house yet!"
    );

    return;

  }


  if (Math.abs(player.speed) > 1) {

    showMessage(
      "Stop the car first! 🚗"
    );

    return;

  }


  delivered = true;

  clearInterval(timerInterval);


  let tip =
    Math.max(
      1,
      Math.floor(
        timeLeft / 7
      )
    );


  let earned =
    6 + tip;

  money += earned;


  document.getElementById(
    "money"
  ).textContent =
    money;


  document.getElementById(
    "deliver"
  ).style.display =
    "none";


  showMessage(
    "Delivered! ♡<br>+$" +
    earned +
    " tip"
  );


  setTimeout(
    newDelivery,
    1800
  );

}


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text) {

  const message =
    document.getElementById(
      "message"
    );

  message.innerHTML =
    text;

  message.style.display =
    "block";


  clearTimeout(
    message.hide
  );


  message.hide =
    setTimeout(() => {

      message.style.display =
        "none";

    }, 1400);

}


/* =====================================================
   GAME LOOP
   ===================================================== */

function loop() {

  updatePlayer();

  updateDirection();

  drawWorld();

  requestAnimationFrame(
    loop
  );

}


/* =====================================================
   START
   ===================================================== */

newDelivery();

loop();

</script>

</body>
</html>
